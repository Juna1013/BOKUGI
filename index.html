<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>墨戯 - BOKUGI</title>
    <!-- 筆文字（Yuji Syuku）を見出しと所作の文言に、古風な明朝（Shippori Mincho）を本文に使う。
         Google Fonts は使う文字のスライスだけを配信するので、日本語でも転送量は小さい -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Yuji+Syuku&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="paper"></canvas>
    <canvas id="inkLayer"></canvas>
    <div class="rinse-front" id="rinseFront" aria-hidden="true"></div>

    <div class="title">
        <span class="title__text">墨戯</span>
        <!-- 出典: 題字の末尾に落款のように置く。色は墨と同じ一色で、触れた時だけ濃くなる -->
        <a class="title__repo" href="https://github.com/Juna1013/BOKUGI" target="_blank" rel="noopener noreferrer"
            aria-label="GitHub でソースコードを見る" title="GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
            </svg>
        </a>
    </div>
    <div class="hint" id="hint"><span>紙に触れてください</span></div>

    <div class="palette" role="radiogroup" aria-label="墨の色">
        <button class="k on" data-c="0" role="radio" aria-checked="true" aria-label="墨">墨</button>
        <button class="r" data-c="1" role="radio" aria-checked="false" aria-label="朱">朱</button>
        <button class="a" data-c="2" role="radio" aria-checked="false" aria-label="藍">藍</button>
    </div>

    <div class="rinse-area">
        <button class="rinse" id="rinse" aria-label="水で洗い流す（長押し）" title="長押しで水を流します">
            <span class="rinse__tank" aria-hidden="true">
                <span class="rinse__water">
                    <svg class="rinse__wave" viewBox="0 0 48 8" preserveAspectRatio="none">
                        <path d="M0 4 Q6 0 12 4 T24 4 T36 4 T48 4 V8 H0 Z" />
                    </svg>
                </span>
            </span>
            <span class="rinse__label">水で洗い流す</span>
            <small class="rinse__sub">長押し</small>
        </button>
        <div class="rinse-spill" aria-hidden="true"></div>
        <p class="rinse-tip" id="rinseTip" role="status" aria-live="polite"></p>
    </div>

    <div class="works-area">
        <button type="button" class="flow-button" id="flowButton" aria-pressed="false"
            title="濡れた墨が流れながら書けます">
            <span class="flow-button__label">流し書き</span>
            <small class="flow-button__state" aria-hidden="true">切</small>
        </button>
        <button class="share-card-button" id="shareCardButton">作品を残す</button>
    </div>

    <dialog class="share-dialog" id="shareDialog" aria-labelledby="shareDialogTitle">
        <div class="share-dialog__content">
            <button type="button" class="share-dialog__close" id="shareDialogClose" aria-label="閉じる">×</button>

            <h2 id="shareDialogTitle">作品カード</h2>

            <img class="share-dialog__preview" id="cardPreview" alt="生成したカード">

            <fieldset class="share-dialog__profile">
                <legend>作家名の掲載</legend>

                <label class="share-dialog__toggle">
                    <input type="checkbox" id="showProfileToggle">
                    <span>作者名を掲載する</span>
                </label>

                <div class="share-dialog__name" id="creatorNameField" hidden>
                    <label for="creatorName">作者名</label>
                    <input type="text" id="creatorName" maxlength="24" autocomplete="nickname"
                        placeholder="例：墨野 花子">
                </div>

                <p class="share-dialog__note" id="creatorProfileNote">
                    掲載をONにすると、作者名がカードの右下に入ります。<br>
                    本名でなくても構いません。名前は端末内にのみ保存されます。
                </p>
            </fieldset>

            <div class="share-dialog__actions">
                <button type="button" id="nativeShareButton" disabled>共有する</button>
                <button type="button" id="downloadCardButton" disabled>PNGで保存</button>
            </div>

            <p class="share-dialog__status" id="shareStatus" aria-live="polite"></p>
        </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
